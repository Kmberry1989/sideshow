<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sideshow</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1><img class="mark" src="../assets/wordmark.png" alt="Sideshow" /><img class="mark mark-light" src="../assets/wordmark-light.png" alt="" aria-hidden="true" /></h1>
      <button id="closeBtn" type="button" aria-label="Close">×</button>
    </header>
    <div class="auth">
      <span id="authLabel"></span>
      <button id="signInBtn" type="button" class="btn">Sign in with Google</button>
      <button id="signOutBtn" type="button" class="btn plain" style="display:none">Sign out</button>
    </div>
    <div class="settings">
      <div class="setting">
        <span class="setting-label">Hotkey</span>
        <button id="hotkeyBtn" type="button" class="btn plain setting-btn">Ctrl+Shift+E</button>
      </div>
      <div class="setting">
        <span class="setting-label">Gesture</span>
        <button id="gestureBtn" type="button" class="btn plain setting-btn">None</button>
        <button id="gestureClearBtn" type="button" class="btn plain setting-btn small" style="display:none" aria-label="Clear gesture">×</button>
      </div>
      <div class="setting">
        <span class="setting-label">Sound</span>
        <button id="soundBtn" type="button" class="btn plain setting-btn" aria-label="Sound on or off">🔊</button>
      </div>
      <div class="setting">
        <span class="setting-label">Motion</span>
        <button id="motionBtn" type="button" class="btn plain setting-btn">Full</button>
      </div>
      <div class="setting">
        <span class="setting-label">Reminders</span>
        <button id="remindersBtn" type="button" class="btn plain setting-btn" aria-label="Reminders on or off">🔔</button>
      </div>
      <div class="setting">
        <span class="setting-label">Accent</span>
        <span id="accentSwatches" class="swatches"></span>
      </div>
    </div>
    <input id="search" type="search" placeholder="Search" autocomplete="off" />
    <p id="status" class="status"></p>
    <main id="eventList"></main>
    <div id="state-loading" class="state">Loading…</div>
    <div id="state-config" class="state">
      <p>Add firebase-config.json</p>
      <button id="openConfigBtn" type="button" class="btn">Open folder</button>
    </div>
    <div id="state-signin" class="state">Sign in to see saved events.</div>
    <div id="state-empty" class="state">No saved events yet.</div>
    <div id="state-error" class="state">Could not load events.</div>
    <script src="bundle.js"></script>
  </body>
</html>
