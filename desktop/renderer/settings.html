<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sideshow Settings</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="settings-window">
    <!-- Settings window: the same settings form the bubble used to
         show in-view. The bubble stays open beside it as a live
         preview while settings change. -->
    <div id="settingsView" class="view settings-view">
      <header class="settings-header">
        <span class="settings-title">Settings</span>
        <button id="settingsCloseBtn" type="button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </header>
      <div class="settings-tabs" id="settingsTabs" role="tablist">
        <button type="button" class="settings-tab active" data-tab="position" role="tab">Position</button>
        <button type="button" class="settings-tab" data-tab="appearance" role="tab">Appearance</button>
        <button type="button" class="settings-tab" data-tab="text" role="tab">Text</button>
        <button type="button" class="settings-tab" data-tab="summon" role="tab">Summon</button>
        <button type="button" class="settings-tab" data-tab="general" role="tab">General</button>
        <button type="button" class="settings-tab" data-tab="events" role="tab">Events</button>
      </div>
      <div class="settings-body">
        <p id="settingsStatus" class="status"></p>
        <div class="settings-tab-panel" id="tab-position">
          <div class="setting">
            <span class="setting-label">Position</span>
            <button id="positionBtn" type="button" class="btn plain setting-btn">Follow cursor</button>
          </div>
        </div>
        <div class="settings-tab-panel" id="tab-appearance" hidden>
          <div class="setting">
            <span class="setting-label">Themes</span>
            <span id="presetBtns" class="seg"></span>
          </div>
          <div class="setting">
            <span class="setting-label">Look</span>
            <span id="appearanceBtns" class="seg">
              <button id="appearanceGlassBtn" type="button" class="btn plain setting-btn">Glass</button>
              <button id="appearanceShadedBtn" type="button" class="btn plain setting-btn">Shaded</button>
              <button id="appearanceClearBtn" type="button" class="btn plain setting-btn">Clear</button>
            </span>
          </div>
          <div class="setting">
            <span class="setting-label">See-through</span>
            <input id="transparencySlider" type="range" min="0" max="100" value="50" aria-label="Transparency" />
          </div>
          <div class="setting">
            <span class="setting-label">Scale</span>
            <input id="scaleSlider" type="range" class="setting-slider" min="80" max="150" value="100" aria-label="Bubble scale" />
            <span id="scaleValue" class="setting-value">100%</span>
          </div>
          <div class="setting">
            <span class="setting-label">Font</span>
            <button id="fontBtn" type="button" class="btn plain setting-btn">Mono</button>
          </div>
          <div class="setting">
            <span class="setting-label">Weight</span>
            <button id="weightBtn" type="button" class="btn plain setting-btn">Regular</button>
          </div>
          <div class="setting">
            <span class="setting-label">Border</span>
            <span id="borderSwatches" class="swatches"></span>
            <input id="borderColorInput" type="color" class="color-input" value="#a44a24" aria-label="Custom border color" title="Custom color" />
          </div>
          <div class="setting">
            <span class="setting-label">Shadow</span>
            <button id="shadowBtn" type="button" class="btn plain setting-btn" aria-label="Shadow on or off">On</button>
          </div>
          <div class="setting">
            <span class="setting-label">Shadow strength</span>
            <input id="shadowStrengthSlider" type="range" class="setting-slider" min="0" max="100" value="40" aria-label="Shadow strength" />
            <span id="shadowStrengthValue" class="setting-value">40</span>
          </div>
          <div class="setting">
            <span class="setting-label">Background</span>
            <span id="bgSwatches" class="swatches"></span>
            <input id="bgColorInput" type="color" class="color-input" value="#a44a24" aria-label="Custom background color" title="Custom color" />
          </div>
          <div class="setting">
            <span class="setting-label">Corners</span>
            <button id="cornerStyleBtn" type="button" class="btn plain setting-btn">Smooth</button>
          </div>
          <div class="setting">
            <span class="setting-label">Roundness</span>
            <input id="cornerRadiusSlider" type="range" class="setting-slider" min="0" max="32" value="32" aria-label="Corner roundness in pixels" />
            <span id="cornerRadiusValue" class="setting-value">32px</span>
          </div>
          <div class="setting">
            <span class="setting-label">Branches</span>
            <button id="alignBtn" type="button" class="btn plain setting-btn">Left</button>
          </div>
          <div class="setting">
            <span class="setting-label">Gentle pulse</span>
            <button id="pulseBtn" type="button" class="btn plain setting-btn" aria-label="Gentle pulse on or off">On</button>
          </div>
          <div class="setting">
            <span class="setting-label">Scrollbar</span>
            <button id="scrollbarBtn" type="button" class="btn plain setting-btn">Slim</button>
          </div>
          <div class="setting">
            <span class="setting-label">Icons</span>
            <span id="iconSwatches" class="swatches"></span>
            <input id="iconColorInput" type="color" class="color-input" value="#2b2118" aria-label="Custom icon color" title="Custom color" />
          </div>
          <div class="setting">
            <span class="setting-label">Separate entries</span>
            <button id="separationBtn" type="button" class="btn plain setting-btn">Bullets</button>
          </div>
        </div>
        <div class="settings-tab-panel" id="tab-text" hidden>
          <div class="setting">
            <span class="setting-label">Text color</span>
            <span id="textColorSwatches" class="swatches"></span>
            <input id="textColorInput" type="color" class="color-input" value="#2b2118" aria-label="Custom text color" title="Custom color" />
          </div>
          <div class="field-outline" id="fieldOutline"></div>
        </div>
        <div class="settings-tab-panel" id="tab-summon" hidden>
          <div class="setting">
            <span class="setting-label">Hotkey</span>
            <button id="hotkeyBtn" type="button" class="btn plain setting-btn">Ctrl+Shift+E</button>
          </div>
          <div class="setting">
            <span class="setting-label">Double-tap</span>
            <button id="doubletapBtn" type="button" class="btn plain setting-btn">Shift</button>
          </div>
          <div class="setting">
            <span class="setting-label">Gesture</span>
            <button id="gestureBtn" type="button" class="btn plain setting-btn">None</button>
            <button id="gestureClearBtn" type="button" class="btn plain setting-btn small" style="display:none" aria-label="Clear gesture"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
          </div>
          <div class="setting">
            <span class="setting-label">Long-click</span>
            <button id="longclickBtn" type="button" class="btn plain setting-btn">None</button>
            <button id="longclickClearBtn" type="button" class="btn plain setting-btn small" style="display:none" aria-label="Clear long-click"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
          </div>
        </div>
        <div class="settings-tab-panel" id="tab-general" hidden>
          <div class="auth">
            <span id="authLabel"></span>
            <button id="signInBtn" type="button" class="btn">Sign in with Google</button>
            <button id="signOutBtn" type="button" class="btn plain" style="display:none">Sign out</button>
          </div>
          <div class="setting">
            <span class="setting-label">Sound</span>
            <button id="soundBtn" type="button" class="btn plain setting-btn" aria-label="Sound on or off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></button>
          </div>
          <div class="setting">
            <span class="setting-label">Motion</span>
            <button id="motionBtn" type="button" class="btn plain setting-btn">Full</button>
          </div>
          <div class="setting">
            <span class="setting-label">Reminders</span>
            <button id="remindersBtn" type="button" class="btn plain setting-btn" aria-label="Reminders on or off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></button>
          </div>
          <div class="setting">
            <span class="setting-label">Accent</span>
            <span id="accentSwatches" class="swatches"></span>
          </div>
          <div class="setting">
            <span class="setting-label">Google Calendar</span>
            <button id="calendarToggleBtn" type="button" class="btn plain setting-btn" aria-label="Show Google Calendar events">Off</button>
          </div>
          <div id="calendarPicker" class="calendar-picker" hidden>
            <p id="calendarPickerStatus" class="calendar-status"></p>
            <div id="calendarList" class="calendar-list"></div>
          </div>
          <div class="setting">
            <span class="setting-label">Help</span>
            <button id="helpBtn" type="button" class="btn plain setting-btn">Open help</button>
          </div>
        </div>
        <div class="settings-tab-panel" id="tab-events" hidden>
          <div id="eventsList" class="events-list"></div>
        </div>
      </div>
    </div>
    <script src="bundle.js"></script>
  </body>
</html>
